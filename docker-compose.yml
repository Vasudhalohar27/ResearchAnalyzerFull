services:
  ui:
    build: .
    image: research-analyzer:latest
    container_name: research-analyzer-ui
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./app/data:/app/app/data
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    image: research-analyzer:latest
    container_name: research-analyzer-api
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app/data:/app/app/data
    restart: unless-stopped
